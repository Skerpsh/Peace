# Типы угроз: ключевые слова (корни, нижний регистр) и уровень тревоги.
# Механика Киева:
#   yellow — угроза БпЛА (шахеды, разведдроны)
#   red    — ракетная угроза (крылатые, баллистика, МиГ-31К / Кинджал)
# Если одновременно есть и ракеты, и БпЛА — уровень red, а в списке целей все типы.
# (КАБ для Киева/области сейчас не актуальны — не отслеживаем.)
#
# clears — какие ещё типы снимаются, когда в сообщении «минула» эта угроза
# (например, «ракетна небезпека минула» снимает и балистику, и крылатые).
threats:
  ballistic:
    level: red
    words: ["балісти", "баллисти", "іскандер", "искандер", "кинджал", "кинжал"]
  cruise_missile:
    level: red
    words: ["крилат", "крылат", "калібр", "калибр", "х-101", "х-555"]
  missile:          # ракета без уточнения типа
    level: red
    words: ["ракет"]
    clears: [ballistic, cruise_missile, aviation]
  aviation:         # взлёт МиГ-31К / Ту-95 = потенциальный ракетный удар
    level: red
    words: ["авіаці", "авиаци", "ту-95", "ту-22", "міг-31", "миг-31"]
  shahed:
    level: yellow
    words: ["шахед", "шахід", "бпла", "мопед", "дрон", "герань"]

markers:
  # Начало тревоги без указания типа угрозы
  alert:  ["повітряна тривога", "воздушная тревога", "тривога", "тревога", "загроза", "угроза", "в укриття", "в укрытие"]
  # Цвет — только запасной вариант, если тип угрозы в тексте не указан
  red:    ["🔴"]
  yellow: ["🟡"]
  # Снятие угрозы. Если во фразе с маркером есть тип угрозы — снимается только он
  # («загроза ракет минула, БпЛА лишаються» -> красный -> жёлтый).
  # Если типа нет — это полный отбой («відбій тривоги»).
  clear:  ["🟢", "відбій", "отбой", "минул", "минувал", "миновал", "знято", "знята", "снят",
           "відсутн", "отсутств", "приземл", "посадк"]

# Разделители фраз внутри сообщения (regex). Маркер снятия действует только в своей фразе.
clause_split: "[.,;!?\\n]+|\\s(?:але|но|однак|проте|однако)\\s"

# Шаблоны направления движения цели (regex, группа 1 — куда)
direction_patterns:
  - "курсом на ([\\w'\\- ]+)"
  - "в напрямку ([\\w'\\- ]+)"
  - "в направлении ([\\w'\\- ]+)"
  - "рухається на ([\\w'\\- ]+)"
  - "движется на ([\\w'\\- ]+)"
