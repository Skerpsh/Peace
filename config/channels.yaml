# Source Telegram channels.
# weight: base trust score (0..1). Unofficial channels stay at or below 0.55, under MIN_CONFIDENCE
#   (0.6): one of them alone is "not confirmed yet" and cannot clear an alert; two of them can.
#   Values come from scripts/source_weights.py (share of a channel's alerts other sources confirmed).
# official: true — official military/city administration channel.
# default_district: fallback district key when a local channel posts an alert/clear
#   without explicitly naming the city/district in the message text.
channels:
  - username: kpszsu                  # Air Force of Ukraine (all-Ukraine official)
    weight: 1.0
    official: true
  - username: VA_Kyiv                 # Kyiv City Military Administration (official)
    weight: 0.95
    official: true
    default_district: kyiv_all
  - username: kyivoda                 # Kyiv Oblast Military Administration (official): alert and all-clear per raion
    weight: 0.95
    official: true
  - username: kievinfo_kyiv           # Kyiv news & monitoring
    weight: 0.45
    official: false
    default_district: kyiv_all
  - username: kyiv_golovne            # Kyiv news & monitoring
    weight: 0.47
    official: false
    default_district: kyiv_all
  - username: irpin_bucha_gostomel    # Irpin / Bucha / Hostomel monitoring
    weight: 0.5
    official: false
    default_district: buchanskyi
  - username: bycanskyy               # Bucha district monitoring
    weight: 0.49
    official: false
    default_district: buchanskyi
