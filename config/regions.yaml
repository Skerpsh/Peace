# Canonical zone keys, Ukrainian display names, and text aliases (UA/RU/EN roots for matching).
# Matching checks substring presence in normalized (lowercase) message text.
kyiv_city:
  # Kyiv is a single zone: city-district and neighbourhood names all map to kyiv_all.
  kyiv_all:        {name: "Київ", aliases: [
    "київ", "києв", "киев", "столиц", "kyiv", "kiev",
    "голосіїв", "голосеев", "теремк", "дарниц", "позняк", "осокорк", "деснян", "троєщин", "троещин",
    "лісов", "дніпровськ", "днепровск", "русанів", "березняк", "воскресенк", "оболон", "пуща-водиц",
    "печерськ", "печерск", "поділ", "подол", "виноградар", "куренів", "святошин", "борщагів", "борщагов",
    "академмістечк", "солом'ян", "соломян", "соломен", "відрадн", "жулян", "шевченків", "шевченковск",
    "лук'янів", "нивк", "сирец"]}

kyiv_oblast:
