  boryspilskyi:    {name: "Бориспільський р-н",        aliases: ["бориспіл", "борисп", "переяслав", "яготин", "boryspil"]}
  brovarskyi:      {name: "Броварський р-н",         aliases: ["бровар", "баришів", "березан", "велика димерк", "brovar"]}
  buchanskyi:      {name: "Бучанський р-н",           aliases: ["буча", "бучан", "ірпін", "ирпен", "гостомел", "бородян", "ворзел", "пісківк", "немішаєв", "коцюбинськ", "макарів", "музич", "бузов", "bucha", "irpin", "hostomel"]}
  vyshhorodskyi:   {name: "Вишгородський р-н",       aliases: ["вишгород", "вышгород", "димер", "дымер", "іванків", "иванков", "воропаїв", "славутич", "чорнобил", "чзв", "vyshhorod"]}
