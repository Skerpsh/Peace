# Ключ — каноническое название, aliases — варианты в тексте (укр/рус, падежи — по корню).
# Поиск идёт по вхождению подстроки в нормализованный (нижний регистр) текст.
kyiv_city:
  holosiivskyi:   {name: "Голосіївський р-н", aliases: ["голосіїв", "голосеев"]}
  darnytskyi:     {name: "Дарницький р-н",    aliases: ["дарниц"]}
  desnianskyi:    {name: "Деснянський р-н",   aliases: ["деснян", "троєщин", "троещин"]}
  dniprovskyi:    {name: "Дніпровський р-н",  aliases: ["дніпровськ", "днепровск"]}
  obolonskyi:     {name: "Оболонський р-н",   aliases: ["оболон"]}
  pecherskyi:     {name: "Печерський р-н",    aliases: ["печерськ", "печерск"]}
  podilskyi:      {name: "Подільський р-н",   aliases: ["поділ", "подол"]}
  sviatoshynskyi: {name: "Святошинський р-н", aliases: ["святошин"]}
  solomianskyi:   {name: "Солом'янський р-н", aliases: ["солом'ян", "соломян", "соломен"]}
  shevchenkivskyi: {name: "Шевченківський р-н", aliases: ["шевченків", "шевченковск"]}
  kyiv_all:       {name: "м. Київ",           aliases: ["київ", "києв", "киев", "столиц"]}

kyiv_oblast:
  bilotserkivskyi: {name: "Білоцерківський р-н", aliases: ["біла церкв", "белая церк", "білоцерків", "белоцерков"]}
  boryspilskyi:    {name: "Бориспільський р-н",  aliases: ["бориспіл", "борисп"]}
  brovarskyi:      {name: "Броварський р-н",     aliases: ["бровар"]}
  buchanskyi:      {name: "Бучанський р-н",      aliases: ["буча", "бучанськ", "ірпін", "ирпен", "гостомел"]}
  vyshhorodskyi:   {name: "Вишгородський р-н",   aliases: ["вишгород", "вышгород"]}
  obukhivskyi:     {name: "Обухівський р-н",     aliases: ["обухів", "обухов", "українк", "украинк"]}
  fastivskyi:      {name: "Фастівський р-н",     aliases: ["фастів", "фастов"]}
  oblast_all:      {name: "Київська обл.",       aliases: ["київщин", "киевщин", "київська обл", "киевская обл"]}
