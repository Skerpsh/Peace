<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="78%" cy="55%" r="60%">
      <stop offset="0" stop-color="#0b3f86" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d0f14" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#0d0f14"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g font-family="Noto Sans" fill="#f5f5f5">
    <text x="80" y="138" font-size="20" font-weight="700" fill="#FFD500" letter-spacing="1">KYIV · KYIV OBLAST · REAL TIME</text>
    <text x="74" y="270" font-size="132" font-weight="800" letter-spacing="-3">PEACE</text>
    <text x="80" y="345" font-size="34" fill="#c9ccd3">Verified air-alert updates,</text>
    <text x="80" y="390" font-size="34" fill="#c9ccd3">readable in two seconds.</text>

    <g font-size="21" font-weight="600">
      <rect x="80" y="440" width="176" height="44" rx="22" fill="#1b1e26" stroke="#2c303b"/>
      <text x="168" y="469" text-anchor="middle">Telegram bot</text>
      <rect x="268" y="440" width="140" height="44" rx="22" fill="#1b1e26" stroke="#2c303b"/>
      <text x="338" y="469" text-anchor="middle">7 sources</text>
      <rect x="420" y="440" width="186" height="44" rx="22" fill="#1b1e26" stroke="#2c303b"/>
      <text x="513" y="469" text-anchor="middle">Cross-checked</text>
    </g>
    <text x="80" y="572" font-family="JetBrainsMono Nerd Font" font-size="22" fill="#7d828e">github.com/Skerpsh/Peace</text>
  </g>

  <!-- Notifications as a locked phone shows them -->
  <g font-family="Noto Sans" filter="url(#shadow)">
    <g transform="translate(700 150)">
      <rect width="500" height="132" rx="26" fill="#f4f5f7" fill-opacity="0.96"/>
      <rect x="22" y="22" width="40" height="40" rx="10" fill="#0057B7"/>
      <rect x="22" y="42" width="40" height="20" rx="0" fill="#FFD500"/>
      <rect x="22" y="22" width="40" height="40" rx="10" fill="none" stroke="#0d0f14" stroke-opacity="0.08"/>
      <text x="76" y="49" font-size="20" font-weight="700" fill="#1b1e26">PEACE</text>
      <text x="476" y="49" font-size="18" fill="#6b707b" text-anchor="end">зараз</text>
      <circle cx="36" cy="86" r="11" fill="#E5484D"/>
      <text x="56" y="94" font-size="25" font-weight="700" fill="#111">Київ: БАЛІСТИКА + ДРОНИ</text>
      <text x="24" y="121" font-size="20" fill="#4a4f5a">з 03:12, щойно</text>
    </g>
    <g transform="translate(740 310)" opacity="0.92">
      <rect width="460" height="118" rx="24" fill="#f4f5f7" fill-opacity="0.9"/>
      <text x="24" y="44" font-size="18" font-weight="700" fill="#1b1e26">PEACE</text>
      <text x="436" y="44" font-size="17" fill="#6b707b" text-anchor="end">21 хв тому</text>
      <circle cx="35" cy="74" r="10" fill="#F5B800"/>
      <text x="54" y="82" font-size="23" font-weight="700" fill="#111">Бучанський р-н: ДРОНИ</text>
      <text x="24" y="107" font-size="19" fill="#4a4f5a">з 02:51, 21 хв</text>
    </g>
    <g transform="translate(780 456)" opacity="0.8">
      <rect width="420" height="108" rx="22" fill="#f4f5f7" fill-opacity="0.85"/>
      <text x="24" y="42" font-size="17" font-weight="700" fill="#1b1e26">PEACE</text>
      <text x="396" y="42" font-size="16" fill="#6b707b" text-anchor="end">учора</text>
      <circle cx="34" cy="69" r="9" fill="#30A46C"/>
      <text x="52" y="76" font-size="21" font-weight="700" fill="#111">Київ: ВІДБІЙ ТРИВОГИ</text>
      <text x="24" y="99" font-size="18" fill="#4a4f5a">Тривога тривала 1 год 12 хв</text>
    </g>
  </g>
</svg>
