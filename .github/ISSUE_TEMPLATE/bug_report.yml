name: Bug report
description: Something in the bot does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A wrong alert from a channel post? Use **Misparsed message** instead.
        For **security vulnerabilities**, please use
        [private reporting](https://github.com/Skerpsh/Peace/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send /zones
        2. ...
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When (date and time, Kyiv)
      placeholder: "2026-10-28 03:12"
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Do not include tokens, the session file or other people's chat ids.
